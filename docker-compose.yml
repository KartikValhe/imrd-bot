services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imrd-chatbot-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLUSTER=true
      - WEB_CONCURRENCY=4
      - REDIS_URL=redis://redis:6379
      - UV_THREADPOOL_SIZE=64
      - MAX_CONCURRENT_LLM_CALLS=40
      - RATE_LIMIT_PER_MINUTE=45
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M

  redis:
    image: redis:7-alpine
    container_name: imrd-chatbot-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

