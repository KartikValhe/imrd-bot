# High-Concurrency Nginx Configuration for RCPET's IMRD Assistant
# Optimized for 1,000 to 5,000+ Concurrent Connections

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 15;
    send_timeout 15;

    # Buffer Limits (prevents memory exhaustion under DoS attacks)
    client_body_buffer_size 128k;
    client_max_body_size 5m;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 16k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # Rate Limiting (Zone Definitions)
    # Allows 45 requests per minute per IP, with burst allowance of 25
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=45r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Node.js Cluster
    upstream imrd_cluster {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name chatbot.rcpimrd.ac.in;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name chatbot.rcpimrd.ac.in;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/chatbot.rcpimrd.ac.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chatbot.rcpimrd.ac.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Max 20 concurrent TCP connections per IP
        limit_conn conn_limit 20;

        # Static Assets Caching (Served directly by Nginx for sub-millisecond delivery)
        location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
            root /var/www/imrd-bot/public;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
            try_files $uri @node_backend;
        }

        # Chat API Endpoint with Rate Limiting
        location /api/chat {
            limit_req zone=chat_limit burst=25 nodelay;

            proxy_pass http://imrd_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Other API Endpoints & Dynamic Routes
        location / {
            proxy_pass http://imrd_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @node_backend {
            proxy_pass http://imrd_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}

